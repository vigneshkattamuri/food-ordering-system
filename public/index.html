<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plateful | Artisanal Food Delivery</title>
  <meta name="description" content="Order handcrafted dishes from premier local kitchens, delivered fresh to your door in minutes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header Bar -->
  <header class="topbar" id="appHeader">
    <div class="topbar-inner">
      <a class="brand" href="#/" id="brandLogo">
        <span class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2v8"/><path d="M22 2v4a2 2 0 0 1-2 2h-4"/><path d="M18 10v12"/><path d="M6 2v20"/><path d="M2 2h8a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H2z"/></svg>
        </span>
        <span class="brand-text">Plateful</span>
      </a>

      <!-- Location Indicator -->
      <button class="loc-pill" id="locPillBtn" type="button" title="Delivery Address">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <span class="loc-label" id="headerLocText">Delivering to: Market Lane</span>
      </button>

      <!-- Search Bar -->
      <div class="search-bar" id="headerSearchBar">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="globalSearchInput" placeholder="Search restaurants, cuisines, or dishes..." autocomplete="off">
        <button type="button" class="search-clear-btn" id="searchClearBtn" hidden aria-label="Clear search">&times;</button>
      </div>

      <!-- Navigation Links -->
      <nav class="nav" aria-label="Main Navigation">
        <a href="#/" data-nav="home" class="nav-link" id="navHomeLink">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Explore</span>
        </a>
        <a href="#/orders" data-nav="orders" class="nav-link" id="navOrdersLink">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span>My Orders</span>
          <span class="pulse-dot" id="activeOrderPulse" hidden title="Active order in progress"></span>
        </a>
        <a href="#/owner" data-nav="owner" class="nav-link" id="ownerLink" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          <span>Merchant</span>
        </a>
        <a href="#/admin" data-nav="admin" class="nav-link" id="adminLink" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Admin</span>
        </a>
      </nav>

      <!-- Action Buttons -->
      <div class="actions">
        <!-- User Menu Dropdown Trigger -->
        <div class="user-menu-wrapper" id="userMenuWrapper">
          <button class="btn ghost user-btn" id="authBtn" type="button" aria-haspopup="true">
            <span class="user-avatar" id="userAvatar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <span class="user-name-text" id="authBtnText">Sign in</span>
          </button>
          <div class="user-dropdown" id="userDropdown" hidden>
            <div class="dropdown-header">
              <p class="dropdown-user-name" id="dropdownUserName">Guest</p>
              <span class="role-badge" id="dropdownUserRole">Customer</span>
            </div>
            <div class="dropdown-divider"></div>
            <button type="button" class="dropdown-item" id="menuProfileBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
              My Profile & Address
            </button>
            <button type="button" class="dropdown-item" id="menuOrdersBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/></svg>
              Order History
            </button>
            <div class="dropdown-divider"></div>
            <button type="button" class="dropdown-item text-danger" id="menuLogoutBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Log out
            </button>
          </div>
        </div>

        <!-- Cart Button -->
        <button class="btn cart-btn" id="cartBtn" type="button" aria-controls="cart" aria-label="Shopping Cart">
          <span class="cart-icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
            <span class="badge" id="cartCount">0</span>
          </span>
          <span class="cart-total-text" id="cartBtnTotal">$0.00</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="view" class="page" tabindex="-1">
    <!-- Rendered dynamically by app.js -->
  </main>

  <!-- Slide-over Cart Drawer -->
  <aside id="cart" class="cart" aria-label="Shopping Cart" hidden>
    <div class="cart-head">
      <div class="cart-head-title">
        <h2>Your Order</h2>
        <span class="cart-subtitle" id="cartSubtitle">0 items</span>
      </div>
      <button class="btn-icon" id="cartClose" type="button" aria-label="Close cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div id="cartBody" class="cart-body"></div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <!-- Authentication Dialog -->
  <dialog id="authDialog" class="modal-dialog">
    <div class="dialog-card">
      <button class="dialog-close-btn" id="authCloseBtn" type="button" aria-label="Close modal">&times;</button>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tabLogin">Log In</button>
        <button type="button" class="auth-tab" id="tabRegister">Sign Up</button>
      </div>

      <!-- Quick Demo Sign-In Box -->
      <div class="demo-login-box">
        <span class="demo-title">⚡ 1-Click Demo Logins:</span>
        <div class="demo-buttons">
          <button type="button" class="demo-chip" data-demo-role="customer">Customer (Sarah)</button>
          <button type="button" class="demo-chip" data-demo-role="owner">Owner (Chef Marco)</button>
          <button type="button" class="demo-chip" data-demo-role="admin">Admin</button>
        </div>
      </div>

      <form id="authForm" novalidate>
        <div id="registerFields" hidden>
          <label>Full Name
            <input name="name" id="regName" placeholder="e.g. Alex Morgan" autocomplete="name">
          </label>
          <div class="form-row">
            <label>Phone Number
              <input name="phone" id="regPhone" type="tel" placeholder="+1 (555) 000-0000" autocomplete="tel">
            </label>
            <label>Account Type
              <select name="role" id="regRole">
                <option value="CUSTOMER">Food Lover (Customer)</option>
                <option value="RESTAURANT_OWNER">Restaurant Owner / Chef</option>
              </select>
            </label>
          </div>
          <label>Delivery Address
            <input name="address" id="regAddress" placeholder="Street, apartment, city" autocomplete="street-address">
          </label>
        </div>

        <label>Email Address
          <input name="email" id="authEmail" type="email" placeholder="you@example.com" autocomplete="email" required>
        </label>
        <label>Password
          <input name="password" id="authPassword" type="password" placeholder="At least 6 characters" autocomplete="current-password" minlength="6" required>
        </label>

        <p class="error" id="authError" role="alert"></p>

        <button class="btn btn-primary btn-block" type="submit" id="authSubmit">Log In</button>
      </form>
    </div>
  </dialog>

  <!-- User Profile Modal -->
  <dialog id="profileDialog" class="modal-dialog">
    <div class="dialog-card">
      <button class="dialog-close-btn" id="profileCloseBtn" type="button" aria-label="Close modal">&times;</button>
      <h2 class="dialog-title">Profile & Delivery Address</h2>
      <form id="profileForm" novalidate>
        <label>Full Name
          <input name="name" id="profName" required>
        </label>
        <label>Phone Number
          <input name="phone" id="profPhone" type="tel">
        </label>
        <label>Default Delivery Address
          <textarea name="defaultAddress" id="profAddress" rows="2" placeholder="Street, Apt, Delivery instructions"></textarea>
        </label>
        <p class="error" id="profileError" role="alert"></p>
        <button class="btn btn-primary" type="submit" id="saveProfileBtn">Save Changes</button>
      </form>

      <div class="dialog-section-divider"></div>
      <h3 class="dialog-subtitle">Change Password</h3>
      <form id="passwordForm" novalidate>
        <label>Current Password
          <input name="oldPassword" type="password" required>
        </label>
        <label>New Password
          <input name="newPassword" type="password" minlength="6" required>
        </label>
        <p class="error" id="passwordError" role="alert"></p>
        <button class="btn ghost" type="submit" id="savePasswordBtn">Update Password</button>
      </form>
    </div>
  </dialog>

  <!-- Order Receipt Modal -->
  <dialog id="receiptDialog" class="modal-dialog">
    <div class="dialog-card" id="receiptContent">
      <!-- Injected dynamically -->
    </div>
  </dialog>

  <!-- Toast Message -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="toast-icon" id="toastIcon"></span>
    <span class="toast-text" id="toastText"></span>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
